name: Android checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Set up Android SDK
        uses: android-actions/setup-android@138b5fb1cf087fdb4c5f3c621466fe304d0cf2e3 # v4.0.3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - name: Run host tests, lint, and APK builds
        run: >-
          ./gradlew --no-daemon
          :domain:test :app:testDebugUnitTest
          :app:lintDebug :app:lintRelease
          :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest
      - name: Verify committed Room schemas
        run: |
          schema_changes=$(git status --porcelain --untracked-files=all -- app/schemas)
          if [ -n "$schema_changes" ]; then
            printf '%s\n' "$schema_changes"
            exit 1
          fi
      - name: Upload reports and screenshots
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: android-checks
          path: |
            domain/build/reports/tests/
            app/build/reports/
            app/build/qa/
          retention-days: 14
